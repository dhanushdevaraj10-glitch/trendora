{% load static %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-content">
  <div class="container">
    <a class="navbar-brand navbar-brand-custom" href="{% url 'home' %}">
      <img src="{% static 'images/trendora-brand.png' %}?v=2" alt="TRENDORA logo" class="brand-logo">
      <span class="brand-label">TRENDORA</span>
      <span class="brand-separator">|</span>
